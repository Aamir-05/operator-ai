name: Operator AI 1.0 Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0*"

permissions:
  contents: write

jobs:
  desktop-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained desktop
        shell: pwsh
        run: ./publish-1.0.ps1 -Runtime win-x64 -SelfContained

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\OperatorAI.iss"'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OperatorAI-1.0-Windows
          path: installer/output/OperatorAI-1.0-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/OperatorAI-1.0-Setup.exe
